name = "file-upload-api"
main = "file-upload-worker.js"
compatibility_date = "2024-01-01"

# Supabase configuration.
# - SUPABASE_URL is non-secret and can live in [vars].
# - SUPABASE_SERVICE_KEY is REQUIRED for production. The worker uses it
#   server-side so storage RLS does not need to permit anonymous writes.
#   Set it with:
#     wrangler secret put SUPABASE_SERVICE_KEY
# - SUPABASE_ANON_KEY is accepted as a fallback (with a console.warn) for
#   backwards compatibility only — set it via `wrangler secret put` if used.
# - PUBLIC_BASE_URL is the public hostname of this worker so the returned
#   downloadUrls point at your deployment.
[vars]
SUPABASE_URL = "https://YOUR_PROJECT.supabase.co"
PUBLIC_BASE_URL = "https://YOUR_FILE_UPLOAD_API.workers.dev"
