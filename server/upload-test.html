<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            margin: 20px 0;
        }
        .upload-area:hover {
            border-color: #007bff;
            background-color: #f8f9fa;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            background-color: #f8f9fa;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
        }
        .download-link {
            display: inline-block;
            margin-top: 10px;
            color: #007bff;
            text-decoration: none;
        }
        .download-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>File Upload Test</h1>

    <div class="upload-area">
        <input type="file" id="fileInput" accept="*/*">
        <p>Choose a file to upload</p>
        <button onclick="uploadFile()">Upload File</button>
    </div>

    <div id="result"></div>

    <script>
        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const resultDiv = document.getElementById('result');

            if (!fileInput.files[0]) {
                resultDiv.innerHTML = '<div class="result error">Please select a file first!</div>';
                return;
            }

            const file = fileInput.files[0];
            resultDiv.innerHTML = '<div class="result">Uploading... Please wait.</div>';

            try {
                const formData = new FormData();
                formData.append('file', file);

                const response = await fetch('https://YOUR_FILE_UPLOAD_API.workers.dev/upload', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.success) {
                    resultDiv.innerHTML = `
                        <div class="result success">
                            <h3>Upload Successful!</h3>
                            <p><strong>Original Name:</strong> ${result.originalName}</p>
                            <p><strong>File Size:</strong> ${(result.size / 1024).toFixed(2)} KB</p>
                            <p><strong>File Type:</strong> ${result.type}</p>
                            <p><strong>File Name:</strong> ${result.fileName}</p>
                            <a href="${result.supabaseUrl}" target="_blank" class="download-link">Download File</a>
                            <br>
                            <a href="${result.downloadUrl}" target="_blank" class="download-link">Get File Info</a>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `<div class="result error">Upload failed: ${result.error}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="result error">Error: ${error.message}</div>`;
            }
        }

        // Auto-upload the icon.png file when page loads
        window.onload = async function() {
            try {
                // Create a test upload with a sample file
                const response = await fetch('/icon.png');
                const blob = await response.blob();
                const file = new File([blob], 'icon.png', { type: 'image/png' });

                const formData = new FormData();
                formData.append('file', file);

                console.log('Auto-uploading icon.png...');

                const uploadResponse = await fetch('https://YOUR_FILE_UPLOAD_API.workers.dev/upload', {
                    method: 'POST',
                    body: formData
                });

                const result = await uploadResponse.json();
                console.log('Auto-upload result:', result);

                if (result.success) {
                    document.getElementById('result').innerHTML = `
                        <div class="result success">
                            <h3>Auto-uploaded icon.png!</h3>
                            <p><strong>Download URL:</strong> <a href="${result.supabaseUrl}" target="_blank">${result.supabaseUrl}</a></p>
                        </div>
                    `;
                }
            } catch (error) {
                console.log('Auto-upload failed:', error);
            }
        };
    </script>
</body>
</html>
