name = "data-transmitter"
main = "worker.js"
compatibility_date = "2024-01-01"

# Required secret for production deployments:
#   wrangler secret put BROADCAST_TOKEN
# When set, POST /broadcast requires `Authorization: Bearer <BROADCAST_TOKEN>`.
# Without it, anyone on the internet can drive the agent by posting
# `new_prompt` messages.

[[durable_objects.bindings]]
name = "DATA_BROADCASTER"
class_name = "DataBroadcaster"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DataBroadcaster"]